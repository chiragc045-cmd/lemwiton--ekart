<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Lemwiton Admin</title><link rel="stylesheet" href="style.css"></head><body><header><b>LEMWITON ADMIN</b><a href="/">Store</a></header><main><section id="login"><h2>Admin Login</h2><form id="lf"><input id="u" value="admin"><span class="password-wrap"><input id="p" type="password" required placeholder="Password"><button type="button" id="togglePassword" class="password-toggle" aria-label="Show password" title="Show password"><svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></span><button>Login</button></form></section><section id="panel" hidden><h2>Orders</h2><button onclick="loadOrders()">Refresh</button><div id="orders"></div><h2 style="margin-top:30px">Customers</h2><button onclick="loadCustomers()">Refresh Customers</button><div id="customers"></div></section></main><style>.password-wrap{position:relative;display:block}.password-wrap #p{padding-right:46px}.password-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;padding:4px;cursor:pointer;display:flex;align-items:center;justify-content:center}.password-toggle svg{display:block}</style><script>let token="";const eyeOpen='<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle>';const eyeClosed='<path d="M3 3l18 18"></path><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path><path d="M9.9 4.2A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a18.7 18.7 0 0 1-3.2 4.2"></path><path d="M6.1 6.1C3.5 8.1 2 12 2 12s3.5 7 10 7a10.8 10.8 0 0 0 2.1-.2"></path>';togglePassword.onclick=()=>{const shown=p.type==="text";p.type=shown?"password":"text";eyeIcon.innerHTML=shown?eyeOpen:eyeClosed;togglePassword.setAttribute("aria-label",shown?"Show password":"Hide password");togglePassword.title=shown?"Show password":"Hide password"};lf.onsubmit=async e=>{e.preventDefault();let r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u.value,password:p.value})});if(!r.ok)return alert("Invalid login");token=(await r.json()).token;login.hidden=true;panel.hidden=false;loadOrders();loadCustomers()};async function loadOrders(){let r=await fetch("/api/orders",{headers:{Authorization:"Bearer "+token}}),x=await r.json();orders.innerHTML=x.length?x.map(o=>`<article><b>${o.id}</b><p>${o.customer_name} • ${o.phone}<br>${o.address}, ${o.city}, ${o.state} - ${o.pin}</p><p>₹${o.total} • Payment: ${o.payment_status}</p><select onchange="setS('${o.id}',this.value)"><option>${o.order_status}</option><option>confirmed</option><option>shipped</option><option>delivered</option><option>cancelled</option></select> <button type="button" onclick="deleteO('${o.id}')">Delete</button></article>`).join(""):"<p>No orders yet.</p>"}async function loadCustomers(){let r=await fetch("/api/customers",{headers:{Authorization:"Bearer "+token}});let x=await r.json();if(!r.ok)return alert(x.error||"Unable to load customers");customers.innerHTML=x.length?x.map(c=>`<article><b>${c.phone}</b><p>${c.name||"Name not added"}${c.email?" • "+c.email:""}<br><small>Joined: ${new Date(c.created_at).toLocaleString()}<br>Last login: ${c.last_login_at?new Date(c.last_login_at).toLocaleString():"—"}</small></p><button type="button" onclick="deleteC('${c.id}')">Delete Customer</button></article>`).join(""):"<p>No customers yet.</p>"}async function setS(id,status){await fetch("/api/orders/"+id,{method:"PATCH",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({status})});loadOrders()}async function deleteO(id){if(!confirm("Delete this order permanently?"))return;let r=await fetch("/api/orders/"+encodeURIComponent(id),{method:"DELETE",headers:{Authorization:"Bearer "+token}});let x=await r.json();if(!r.ok)return alert(x.error||"Unable to delete order");loadOrders()}async function deleteC(id){if(!confirm("Delete this customer login/account permanently? Orders will not be deleted."))return;let r=await fetch("/api/customers/"+encodeURIComponent(id),{method:"DELETE",headers:{Authorization:"Bearer "+token}});let x=await r.json();if(!r.ok)return alert(x.error||"Unable to delete customer");loadCustomers()}</script></body></html>

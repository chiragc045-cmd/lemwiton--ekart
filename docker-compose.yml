services:
  web:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lemwiton
      POSTGRES_USER: lemwiton
      POSTGRES_PASSWORD: CHANGE_THIS_DB_PASSWORD
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Lemwiton Admin</title><link rel="stylesheet" href="style.css"></head><body><header><b>LEMWITON ADMIN</b><a href="/">Store</a></header><main><section id="login"><h2>Admin Login</h2><form id="lf"><input id="u" value="admin"><input id="p" type="password" required placeholder="Password"><button>Login</button></form></section><section id="panel" hidden><h2>Orders</h2><button onclick="loadOrders()">Refresh</button><div id="orders"></div></section></main><script>let token="";lf.onsubmit=async e=>{e.preventDefault();let r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u.value,password:p.value})});if(!r.ok)return alert("Invalid login");token=(await r.json()).token;login.hidden=true;panel.hidden=false;loadOrders()};async function loadOrders(){let r=await fetch("/api/orders",{headers:{Authorization:"Bearer "+token}}),x=await r.json();orders.innerHTML=x.length?x.map(o=>`<article><b>${o.id}</b><p>${o.customer_name} • ${o.phone}<br>${o.address}, ${o.city}, ${o.state} - ${o.pin}</p><p>₹${o.total} • Payment: ${o.payment_status}</p><select onchange="setS('${o.id}',this.value)"><option>${o.order_status}</option><option>confirmed</option><option>shipped</option><option>delivered</option><option>cancelled</option></select></article>`).join(""):"<p>No orders yet.</p>"}async function setS(id,status){await fetch("/api/orders/"+id,{method:"PATCH",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({status})});loadOrders()}</script></body></html>

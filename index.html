<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Lemwiton 5 Slide Slider</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<section class="hero-slider" aria-label="Lemwiton featured products">
  <div class="slider-track" id="sliderTrack">
    <div class="slide"><img src="hero-banner.jpeg" alt="Lemwiton Ayurveda"></div>
    <div class="slide"><img src="product-shampoo.jpeg" alt="Lemwiton Herbal Shampoo"></div>
    <div class="slide"><img src="product-hair-serum.jpeg" alt="Lemwiton Fully Vital Hair Serum"></div>
    <div class="slide"><img src="product-bhringraj-oil.png" alt="Lemwiton Maha Bhringraj Hair Oil"></div>
    <div class="slide"><img src="product-amla-oil.png" alt="Lemwiton Amla Hair Oil"></div>
  </div>

  <button class="slider-arrow prev" id="prevBtn" aria-label="Previous slide">‹</button>
  <button class="slider-arrow next" id="nextBtn" aria-label="Next slide">›</button>

  <div class="slider-dots" id="sliderDots" aria-label="Slide navigation">
    <button class="dot active" data-slide="0" aria-label="Slide 1"></button>
    <button class="dot" data-slide="1" aria-label="Slide 2"></button>
    <button class="dot" data-slide="2" aria-label="Slide 3"></button>
    <button class="dot" data-slide="3" aria-label="Slide 4"></button>
    <button class="dot" data-slide="4" aria-label="Slide 5"></button>
  </div>
</section>
<script src="app.js"></script>
</body>
</html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Lemwiton Admin</title><link rel="stylesheet" href="style.css"></head><body><header><b>LEMWITON ADMIN</b><a href="/">Store</a></header><main><section id="login"><h2>Admin Login</h2><form id="lf"><input id="u" value="admin"><span style="position:relative;display:inline-block"><input id="p" type="password" required placeholder="Password" style="padding-right:42px"><button type="button" id="togglePassword" aria-label="Show password" title="Show password" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;cursor:pointer;font-size:18px;padding:4px">&#128065;</button></span><button>Login</button></form></section><section id="panel" hidden><h2>Orders</h2><button onclick="loadOrders()">Refresh</button><div id="orders"></div><h2 style="margin-top:30px">Customers</h2><button onclick="loadCustomers()">Refresh Customers</button><div id="customers"></div></section></main><script>let token="";lf.onsubmit=async e=>{e.preventDefault();let r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u.value,password:p.value})});if(!r.ok)return alert("Invalid login");token=(await r.json()).token;login.hidden=true;panel.hidden=false;loadOrders();loadCustomers()};async function loadOrders(){let r=await fetch("/api/orders",{headers:{Authorization:"Bearer "+token}}),x=await r.json();orders.innerHTML=x.length?x.map(o=>`<article><b>${o.id}</b><p>${o.customer_name} • ${o.phone}<br>${o.address}, ${o.city}, ${o.state} - ${o.pin}</p><p>₹${o.total} • Payment: ${o.payment_status}</p><select onchange="setS('${o.id}',this.value)"><option>${o.order_status}</option><option>confirmed</option><option>shipped</option><option>delivered</option><option>cancelled</option></select> <button type="button" onclick="deleteO('${o.id}')">Delete</button></article>`).join(""):"<p>No orders yet.</p>"}async function loadCustomers(){let r=await fetch("/api/customers",{headers:{Authorization:"Bearer "+token}});let x=await r.json();if(!r.ok)return alert(x.error||"Unable to load customers");customers.innerHTML=x.length?x.map(c=>`<article><b>${c.phone}</b><p>${c.name||"Name not added"}${c.email?" • "+c.email:""}<br><small>Joined: ${new Date(c.created_at).toLocaleString()}<br>Last login: ${c.last_login_at?new Date(c.last_login_at).toLocaleString():"—"}</small></p><button type="button" onclick="deleteC('${c.id}')">Delete Customer</button></article>`).join(""):"<p>No customers yet.</p>"}async function setS(id,status){await fetch("/api/orders/"+id,{method:"PATCH",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({status})});loadOrders()}async function deleteO(id){if(!confirm("Delete this order permanently?"))return;let r=await fetch("/api/orders/"+encodeURIComponent(id),{method:"DELETE",headers:{Authorization:"Bearer "+token}});let x=await r.json();if(!r.ok)return alert(x.error||"Unable to delete order");loadOrders()}async function deleteC(id){if(!confirm("WARNING: Delete this customer permanently? Their customer account will be deleted, but existing orders will remain."))return;let r=await fetch("/api/customers/"+encodeURIComponent(id),{method:"DELETE",headers:{Authorization:"Bearer "+token}});let x=await r.json();if(!r.ok)return alert(x.error||"Unable to delete customer");loadCustomers()}const togglePassword=document.getElementById("togglePassword");togglePassword.onclick=()=>{const visible=p.type==="text";p.type=visible?"password":"text";togglePassword.setAttribute("aria-label",visible?"Show password":"Hide password");togglePassword.setAttribute("title",visible?"Show password":"Hide password")}</script></body></html>
